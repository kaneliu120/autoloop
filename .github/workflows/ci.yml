name: CI (Python unit tests)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,runner]"
          python3 -c "from autoloop_scripts.locate import scripts_directory; p=scripts_directory(); assert (p/'autoloop-state.py').is_file(), p"
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Compile project Python files
        run: python3 -m compileall -q scripts services mcp-server
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
